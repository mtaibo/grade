server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Caddy and Cloudflare sit in front: no version in errors, and the usual hardening headers.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png)$ {
        expires 1d;
    }

    error_page 404 /404.html;
}
