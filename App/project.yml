name: Grade
options:
  bundleIdPrefix: com.migueltaibo
  developmentLanguage: es
  deploymentTarget:
    iOS: "27.0"

packages:
  grade:
    path: ..

targets:
  Grade-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migueltaibo.grade
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
      configs:
        # Debug builds only the run destination's architecture, like the Engine package does;
        # building x86_64 as well leaves the app without an Engine module for that slice.
        Debug:
          ONLY_ACTIVE_ARCH: YES
    dependencies:
      - package: grade
        product: Engine

schemes:
  Grade-iOS:
    build:
      targets:
        Grade-iOS: all
    run:
      config: Debug
    test:
      config: Debug
