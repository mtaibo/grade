name: Mark
options:
  bundleIdPrefix: com.migueltaibo
  deploymentTarget:
    iOS: "27.0"

packages:
  mark:
    path: ..

targets:
  Mark-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migueltaibo.mark
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: mark
        product: Engine

schemes:
  Mark-iOS:
    build:
      targets:
        Mark-iOS: all
    run:
      config: Debug
    test:
      config: Debug
